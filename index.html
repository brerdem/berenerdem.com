<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Beren Erdem · Çok tatlı bir şey yolda</title>
  <meta name="description" content="Beren Erdem'in internetteki minicik köşesi. 30 Mart 2026'da doğdu. Çok tatlı bir şey yolda!">
  <meta name="theme-color" content="#fff6ec">
  <meta property="og:title" content="Beren Erdem">
  <meta property="og:description" content="Çok tatlı bir şey yolda. 30 Mart 2026'da doğdu.">
  <meta property="og:url" content="https://berenerdem.com/">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="tr_TR">
  <meta property="og:image" content="https://berenerdem.com/assets/img/beren.png">
  <meta property="og:image:alt" content="Kocaman gülümseyen bebek Beren">
  <link rel="preload" href="/assets/img/beren.webp" as="image" type="image/webp">
  <link rel="canonical" href="https://berenerdem.com/">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=Patrick+Hand&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <svg class="defs" aria-hidden="true" focusable="false">
    <defs>
      <filter id="wobble" x="-10%" y="-10%" width="120%" height="120%">
        <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <symbol id="cloud" viewBox="0 0 130 76">
        <path d="M24 64c-15 1-21-17-8-24-4-15 13-25 25-16 4-15 27-20 36-6 9-9 29-5 30 11 14-1 21 19 6 26-6 3-13 2-20 2-21 1-46 1-69 7z" fill="#fff" stroke="#5b4a6b" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/>
        <path d="M44 44q3 3 6 0M70 44q3 3 6 0" fill="none" stroke="#5b4a6b" stroke-width="2.6" stroke-linecap="round"/>
        <circle cx="38" cy="50" r="4" fill="#ffc2d1"/>
        <circle cx="82" cy="50" r="4" fill="#ffc2d1"/>
      </symbol>
      <symbol id="cloud-plain" viewBox="0 0 130 76">
        <path d="M24 64c-15 1-21-17-8-24-4-15 13-25 25-16 4-15 27-20 36-6 9-9 29-5 30 11 14-1 21 19 6 26-6 3-13 2-20 2-21 1-46 1-69 7z" fill="#fff" stroke="#5b4a6b" stroke-width="3.2" stroke-linejoin="round"/>
      </symbol>
      <symbol id="star" viewBox="0 0 50 50">
        <path d="M25 4c2 5 4 10 6 14l15 2-11 10 3 15-13-8-13 8 3-15L4 20l15-2z" fill="currentColor" stroke="#5b4a6b" stroke-width="2.6" stroke-linejoin="round"/>
      </symbol>
      <symbol id="heart" viewBox="0 0 50 46">
        <path d="M25 42C11 32 3 24 5 14 7 5 20 3 25 13 30 3 43 5 45 14c2 10-6 18-20 28z" fill="currentColor" stroke="#5b4a6b" stroke-width="2.6" stroke-linejoin="round"/>
        <path d="M12 15q1-5 6-5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" opacity=".8"/>
      </symbol>
      <symbol id="sparkle" viewBox="0 0 40 40">
        <path d="M20 2q2 16 18 18-16 2-18 18-2-16-18-18Q18 18 20 2z" fill="currentColor" stroke="#5b4a6b" stroke-width="2.2" stroke-linejoin="round"/>
      </symbol>
      <symbol id="moon" viewBox="0 0 70 70">
        <path d="M44 6C26 7 12 22 13 40c1 17 18 28 35 25 6-1 11-4 15-8-17 2-30-10-31-26-1-11 4-20 12-25z" fill="#ffe08a" stroke="#5b4a6b" stroke-width="3" stroke-linejoin="round"/>
        <path d="M24 36q3 3 6 0" fill="none" stroke="#5b4a6b" stroke-width="2.4" stroke-linecap="round"/>
        <circle cx="23" cy="44" r="3.4" fill="#ffb3c6"/>
        <path d="M22 18l3 1M18 52l3-2" stroke="#e7b84d" stroke-width="2.4" stroke-linecap="round"/>
      </symbol>
      <symbol id="squiggle" viewBox="0 0 220 24">
        <path d="M6 14c12-10 22-10 30 0s20 10 30 0 20-10 30 0 20 10 30 0 20-10 30 0 20 10 30 0 18-8 28-2" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
      </symbol>
      <symbol id="swirl" viewBox="0 0 60 40">
        <path d="M4 30c10-2 16-10 12-16-3-5-11-2-9 4 3 8 20 9 30 2 8-6 12-12 20-12" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
      </symbol>
      <symbol id="rattle" viewBox="0 0 60 80">
        <circle cx="30" cy="24" r="19" fill="#c7e8f5" stroke="#5b4a6b" stroke-width="3"/>
        <path d="M17 18q13 8 26 0M15 28q15 8 30 0" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
        <path d="M27 43l-1 22M33 43l1 22" stroke="#5b4a6b" stroke-width="3" stroke-linecap="round"/>
        <circle cx="30" cy="70" r="7" fill="#ffc2d1" stroke="#5b4a6b" stroke-width="3"/>
      </symbol>
      <symbol id="blob" viewBox="0 0 200 210">
        <path d="M104 9c42-2 80 26 86 72 6 44-12 98-58 116-40 16-90 6-112-34C0 125 4 74 30 42 49 19 74 10 104 9z" fill="currentColor" stroke="#5b4a6b" stroke-width="3.4" stroke-linejoin="round"/>
        <path d="M98 15c44 0 78 30 83 70 5 42-16 92-60 106-38 12-82 0-101-36-18-34-10-82 18-108 16-16 36-31 60-32z" fill="none" stroke="#5b4a6b" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="9 7 3 7" opacity=".55"/>
      </symbol>
      <filter id="sticker" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
        <feComponentTransfer in="SourceAlpha" result="solid">
          <feFuncA type="linear" slope="5" intercept="-1.5"/>
        </feComponentTransfer>
        <feMorphology in="solid" operator="dilate" radius="5" result="fat"/>
        <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="9" result="noise"/>
        <feDisplacementMap in="fat" in2="noise" scale="7" xChannelSelector="R" yChannelSelector="G" result="border"/>
        <feMorphology in="border" operator="dilate" radius="2" result="outline"/>
        <feFlood flood-color="#c9b6f2" flood-opacity=".8"/>
        <feComposite in2="outline" operator="in"/>
        <feOffset dx="5" dy="6" result="shadow"/>
        <feFlood flood-color="#4a3b5c"/>
        <feComposite in2="outline" operator="in" result="ink"/>
        <feFlood flood-color="#ffffff"/>
        <feComposite in2="border" operator="in" result="paper"/>
        <feMerge>
          <feMergeNode in="shadow"/>
          <feMergeNode in="ink"/>
          <feMergeNode in="paper"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
      <filter id="grain" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" stitchTiles="stitch"/>
        <feColorMatrix values="0 0 0 0 0.35  0 0 0 0 0.27  0 0 0 0 0.4  0 0 0 1.4 -0.45"/>
      </filter>
    </defs>
  </svg>

  <div class="sky" aria-hidden="true">
    <svg class="doodle moon"><use href="#moon"/></svg>

    <svg class="doodle cloud cloud--1"><use href="#cloud"/></svg>
    <svg class="doodle cloud cloud--2"><use href="#cloud-plain"/></svg>
    <svg class="doodle cloud cloud--3"><use href="#cloud-plain"/></svg>
    <svg class="doodle cloud cloud--4"><use href="#cloud"/></svg>

    <svg class="doodle star star--1"><use href="#star"/></svg>
    <svg class="doodle star star--2"><use href="#star"/></svg>
    <svg class="doodle star star--3"><use href="#star"/></svg>
    <svg class="doodle star star--4"><use href="#star"/></svg>
    <svg class="doodle star star--5"><use href="#star"/></svg>

    <svg class="doodle sparkle sparkle--1"><use href="#sparkle"/></svg>
    <svg class="doodle sparkle sparkle--2"><use href="#sparkle"/></svg>
    <svg class="doodle sparkle sparkle--3"><use href="#sparkle"/></svg>
    <svg class="doodle sparkle sparkle--4"><use href="#sparkle"/></svg>

    <svg class="doodle heart heart--1"><use href="#heart"/></svg>
    <svg class="doodle heart heart--2"><use href="#heart"/></svg>
    <svg class="doodle heart heart--3"><use href="#heart"/></svg>

    <svg class="doodle swirl swirl--1"><use href="#swirl"/></svg>
    <svg class="doodle swirl swirl--2"><use href="#swirl"/></svg>

    <svg class="doodle rattle"><use href="#rattle"/></svg>
  </div>

  <main class="card">
    <p class="hello">merhaba dünya! işte karşınızda</p>

    <figure class="portrait">
      <svg class="portrait-blob" aria-hidden="true" focusable="false"><use href="#blob"/></svg>
      <div class="portrait-photo">
        <picture>
          <source srcset="/assets/img/beren.webp" type="image/webp">
          <img src="/assets/img/beren.png" width="444" height="600" alt="Kocaman gülümseyen bebek Beren" decoding="async" fetchpriority="high">
        </picture>
        <svg class="portrait-grain" aria-hidden="true" focusable="false"><rect width="100%" height="100%" filter="url(#grain)"/></svg>
      </div>
      <div class="crown" aria-hidden="true">
        <svg class="crown-star crown-star--1"><use href="#star"/></svg>
        <svg class="crown-star crown-star--2"><use href="#star"/></svg>
        <svg class="crown-star crown-star--3"><use href="#star"/></svg>
        <svg class="crown-star crown-star--4"><use href="#star"/></svg>
        <svg class="crown-star crown-star--5"><use href="#star"/></svg>
      </div>
      <svg class="portrait-doodle portrait-heart portrait-heart--1" aria-hidden="true" focusable="false"><use href="#heart"/></svg>
      <svg class="portrait-doodle portrait-heart portrait-heart--2" aria-hidden="true" focusable="false"><use href="#heart"/></svg>
      <svg class="portrait-doodle portrait-sparkle portrait-sparkle--1" aria-hidden="true" focusable="false"><use href="#sparkle"/></svg>
      <svg class="portrait-doodle portrait-sparkle portrait-sparkle--2" aria-hidden="true" focusable="false"><use href="#sparkle"/></svg>
      <svg class="portrait-doodle portrait-swirl" aria-hidden="true" focusable="false"><use href="#swirl"/></svg>
    </figure>

    <h1 class="name">
      <span class="visually-hidden">Beren</span>
      <span class="letters" aria-hidden="true"><span>B</span><span>e</span><span>r</span><span>e</span><span>n</span></span>
    </h1>
    <svg class="underline" aria-hidden="true" focusable="false"><use href="#squiggle"/></svg>

    <p class="tagline">Çok tatlı bir şey yolda</p>

    <div class="sign">
      <span class="tape tape--left" aria-hidden="true"></span>
      <span class="tape tape--right" aria-hidden="true"></span>
      <p>yapım aşamasında</p>
      <p class="sign-sub">minik eller bu sayfayı hâlâ boyuyor</p>
    </div>

    <p class="born">
      <svg class="born-heart" aria-hidden="true" focusable="false"><use href="#heart"/></svg>
      <span><time datetime="2026-03-30">30 Mart 2026</time>'da doğdu</span>
    </p>
  </main>

  <footer class="footer">
    <p>berenerdem.com</p>
  </footer>
</body>
</html>
